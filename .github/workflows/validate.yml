name: Validate skill package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate distributed skill structure
        run: python scripts/validate.py
      - name: Test standard-library tooling
        run: python -m unittest discover -s tests -v
      - name: Check file governance
        run: python scripts/governance.py check
